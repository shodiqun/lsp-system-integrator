jenkins:
  controller:
    image: jenkins-lts-min
    tag: latest
    imagePullPolicy: IfNotPresent
    adminUser: admin
    adminPassword: admin
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 2Gi
    # Plugins sudah terpasang di image prebaked, jadi kosongkan di chart
    installPlugins: []
    sidecars:
      configAutoReload:
        enabled: false
    JCasC:
      defaultConfig: |
        jenkins:
          systemMessage: "CI/CD untuk ecommerce auto-remediation"
          numExecutors: 2
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      id: "dockerhub-creds"
                      username: "changeme"
                      password: "changeme"
                      description: "Docker Hub credentials (update in UI)"
    persistence:
      enabled: false

    # Expose Jenkins via NGINX Ingress at http://jenkins.local
    serviceType: ClusterIP
    ingress:
      enabled: true
      hostName: jenkins.local
      annotations:
        kubernetes.io/ingress.class: nginx
      tls: []

monitoring: {}
